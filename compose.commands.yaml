# Complementa compose.app.yaml para habilitar o dispatcher dentro do gateway na homologação.
services:
  tracking-gateway:
    environment:
      TRACKING_DISPATCH_OWNER_FILE: /var/lib/aporia-dispatch/owner
    # O UUID do emissor precisa sobreviver à recriação do contêiner para recuperar suas transmissões.
    volumes:
      - dispatch-owner:/var/lib/aporia-dispatch

volumes:
  dispatch-owner:
