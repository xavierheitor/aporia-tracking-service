name: aporia-observability

x-observability: &observability

  restart: unless-stopped

  security_opt:
    - no-new-privileges:true

  networks:
    - observability

  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"


services:

  prometheus:
    <<: *observability

    image: prom/prometheus:v3.5.0

    user: "${OBSERVABILITY_UID:-1000}:${OBSERVABILITY_GID:-1000}"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}

    ports:
      - "${OBSERVABILITY_PUBLISH_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./runtime/observability/prometheus:/prometheus

    secrets:
      - tracking_monitoring_password

    mem_limit: 768m
    cpus: 1.0


  grafana:
    <<: *observability

    image: grafana/grafana:12.1.0

    environment:

      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}

      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

    ports:
      - "${OBSERVABILITY_PUBLISH_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana-data:/var/lib/grafana

      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro

      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards/tracking:ro

    mem_limit: 512m
    cpus: 1.0


  alertmanager:
    <<: *observability

    image: prom/alertmanager:v0.28.1

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

    ports:
      - "${OBSERVABILITY_PUBLISH_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"

    volumes:
      - ./docker/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

    mem_limit: 128m
    cpus: 0.5

  loki:
    <<: *observability

    image: grafana/loki:3.5.1

    command:
      - -config.file=/etc/loki/loki.yml

    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

    mem_limit: 768m
    cpus: 1.0


  alloy:
    <<: *observability

    image: grafana/alloy:v1.9.2

    user: "0:0"

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    ports:
      - "127.0.0.1:12345:12345"

    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    mem_limit: 512m
    cpus: 0.5

  glitchtip-postgres:
    <<: *observability

    image: postgres:17-alpine

    profiles: [glitchtip]

    environment:
      POSTGRES_DB: ${GLITCHTIP_DB_NAME:-glitchtip}
      POSTGRES_USER: ${GLITCHTIP_DB_USER:-glitchtip}
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-}

    volumes:
      - glitchtip-postgres-data:/var/lib/postgresql/data

    networks:
      - glitchtip-backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    mem_limit: 256m
    cpus: 0.5

    stop_grace_period: 30s


  glitchtip:
    <<: *observability

    image: glitchtip/glitchtip:6.2.2

    profiles: [glitchtip]

    environment:
      DATABASE_URL: postgresql://${GLITCHTIP_DB_USER:-glitchtip}:${GLITCHTIP_DB_PASSWORD:-}@glitchtip-postgres:5432/${GLITCHTIP_DB_NAME:-glitchtip}

      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}

      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}

      DEFAULT_FROM_EMAIL: glitchtip@localhost
      EMAIL_URL: consolemail://

      VALKEY_URL: ""

      SERVER_ROLE: all_in_one
      GLITCHTIP_EMBED_WORKER: "true"

      GRANIAN_WORKERS: "1"
      VTASKS_CONCURRENCY: "2"
      DATABASE_POOL_MAX_SIZE: "5"

      LOG_LEVEL: WARNING

    depends_on:
      glitchtip-postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:${GLITCHTIP_PORT:-8000}:8000"

    volumes:
      - glitchtip-uploads:/code/uploads

    networks:
      - observability
      - glitchtip-backend

    mem_limit: 512m
    cpus: 1.0

    stop_grace_period: 60s

networks:

  observability:
    name: aporia-observability
    external: true

  glitchtip-backend:
    driver: bridge
    internal: true


volumes:

  grafana-data:

  alertmanager-data:

  loki-data:

  alloy-data:

  glitchtip-postgres-data:

  glitchtip-uploads:


secrets:

  tracking_monitoring_password:
    file: ./runtime/observability/secrets/tracking-monitoring-password