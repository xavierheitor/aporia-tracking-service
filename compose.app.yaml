name: aporia-tracking-app

services:
  tracking-gateway:
    image: aporia-tracking-java:dev
    container_name: aporia-tracking-gateway

    restart: unless-stopped

    command:
      - java
      - -cp
      - /app/app.jar
      - software.aporia.tracking.gateway.TcpGateway

    env_file:
      - .env

    environment:
      TRACKING_DB_URL: jdbc:postgresql://postgres-postgis:5432/aporia_tracking_v2
      TRACKING_TCP_PORT: "5500"
      TRACKING_PROTOCOL: ${TRACKING_PROTOCOL:-auto}
      TRACKING_TCP_SESSION_IDLE_SECONDS: ${TRACKING_TCP_SESSION_IDLE_SECONDS:-180}

    ports:
      - "127.0.0.1:5500:5500"

    networks:
      - tracking-network

    stop_grace_period: 15s

  # O worker usa a mesma imagem do gateway e inicia sua própria JVM para consumir a fila.
  tracking-worker:
    image: aporia-tracking-java:dev
    container_name: aporia-tracking-worker

    restart: unless-stopped

    command:
      - java
      - -cp
      - /app/app.jar
      - software.aporia.tracking.worker.WorkerApplication

    env_file:
      - .env

    environment:
      TRACKING_DB_URL: jdbc:postgresql://postgres-postgis:5432/aporia_tracking_v2

    networks:
      - tracking-network

    stop_grace_period: 15s

networks:
  tracking-network:
    external: true
    name: aporia-tracking-service_default
