name: aporia-tracking-app

x-runtime: &runtime
  image: ${TRACKING_RELEASE_IMAGE:-aporia-tracking-java:dev}
  restart: unless-stopped
  stop_grace_period: 15s
  networks:
    - database

x-database-env: &database-env
  TRACKING_DB_URL: ${TRACKING_CONTAINER_DB_URL:-jdbc:postgresql://postgres:5432/aporia_tracking_v2}

services:
  tracking-gateway:
    <<: *runtime
    command: ["java", "-cp", "/app/app.jar", "software.aporia.tracking.gateway.TcpGateway"]
    environment:
      <<: *database-env
      TRACKING_DB_USER: tracking_gateway
      TRACKING_DB_PASSWORD: ${TRACKING_GATEWAY_DB_PASSWORD:?configure a senha do gateway}
      TRACKING_TCP_PORT: "5500"
      TRACKING_TCP_BIND: ${TRACKING_TCP_BIND:-0.0.0.0}
      TRACKING_PROTOCOL: ${TRACKING_PROTOCOL:-auto}
      TRACKING_TCP_SESSION_IDLE_SECONDS: ${TRACKING_TCP_SESSION_IDLE_SECONDS:-180}
      TRACKING_DISPATCH_OWNER_FILE:
    ports:
      - "${TRACKING_PUBLISH_ADDRESS:-127.0.0.1}:${TRACKING_TCP_PORT:-5500}:5500"
    volumes:
      - dispatch-owner:/var/lib/aporia-dispatch

  tracking-worker:
    <<: *runtime
    command: ["java", "-cp", "/app/app.jar", "software.aporia.tracking.worker.WorkerApplication"]
    environment:
      <<: *database-env
      TRACKING_DB_USER: tracking_worker
      TRACKING_DB_PASSWORD: ${TRACKING_WORKER_DB_PASSWORD:?configure a senha do worker}

networks:
  database:
    external: true
    name: ${TRACKING_DATABASE_NETWORK:-aporia-tracking-db_default}

volumes:
  dispatch-owner:
