services:
  postgres:
    image: aporia-postgres-postgis:16
    platform: linux/arm64
    container_name: aporia-tracking-postgis
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking_dev
    # Porta local da instância de desenvolvimento.
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - tracking_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tracking_postgis_data: