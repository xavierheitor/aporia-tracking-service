services:
  postgres:
    image: postgres:16
    container_name: aporia-tracking-postgres
    environment:
      POSTGRES_DB: aporia_tracking
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tracking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d aporia_tracking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tracking_postgres_data:
