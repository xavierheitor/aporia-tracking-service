name: aporia-tracking-db

services:
  postgres:
    image: aporia-postgres-postgis:16
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRACKING_DATABASE_NAME:-aporia_tracking_v2}
      POSTGRES_USER: ${TRACKING_ADMIN_DB_USER:-tracking_admin}
      POSTGRES_PASSWORD: ${TRACKING_ADMIN_DB_PASSWORD:?configure a senha administrativa}
    ports:
      - "127.0.0.1:${TRACKING_DATABASE_PORT:-55434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
