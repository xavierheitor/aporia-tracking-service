server:
  port: -1

management:
  server:
    port: ${TRACKING_MANAGEMENT_PORT:9102}
  
  endpoint:
    health:
      group:
        liveness:
          include:
            - livenessState
            - trackingWorker

        readiness:
          include:
            - readinessState
            - trackingWorker
            - db

  metrics:
    tags:
      component: worker