global:

  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

  external_labels:
    environment: development

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: prometheus

    static_configs:
      - targets:
          - localhost:9090


  - job_name: tracking-gateway

    metrics_path: /actuator/prometheus

    basic_auth:
      username: monitoring
      password_file: /run/secrets/tracking_monitoring_password

    static_configs:
      - targets:
          - tracking-gateway:9100


  - job_name: tracking-worker

    metrics_path: /actuator/prometheus

    basic_auth:
      username: monitoring
      password_file: /run/secrets/tracking_monitoring_password

    static_configs:
      - targets:
          - tracking-worker:9100


  - job_name: tracking-monitor

    metrics_path: /actuator/prometheus

    basic_auth:
      username: monitoring
      password_file: /run/secrets/tracking_monitoring_password

    static_configs:
      - targets:
          - tracking-monitor:9100